
[package]
name = "metron-rs"
version = "0.1.0"
edition = "2024"
description = "Difficulty and performance calculators for rhythm games (osu!mania, Etterna, Quaver)"
license = "MIT"
repository = "https://github.com/Glubus/Metron"

[dependencies]
minacalc-rs = { version = "515" }
rhythm-open-exchange = { version = "0.6.2", features = ["compression"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
pretty_assertions = "1.4.1"
rayon = "1.11.0"
rstest = "0.26.1"
serde_json = "1"

[[example]]
name = "minacalc515"

[[example]]
name = "quaver2025"

[[example]]
name = "osu2018"

[[example]]
name = "osu2016"

[[example]]
name = "sunnyxxy"

[[example]]
name = "leyna_recognition"

[[example]]
name = "interlude2025"

[[bench]]
name = "calculator_benchmark"
harness = false
