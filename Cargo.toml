
[package]
name = "metron-rs"
version = "0.4.0"
edition = "2024"
description = "Difficulty and performance calculators for rhythm games (osu!mania, Etterna, Quaver)"
license = "MIT"
repository = "https://github.com/Glubus/Metron"

[dependencies]
minacalc-rs = "527"
rox = { package = "rhythm-open-exchange", version = "0.8", default-features = false, features = ["formats"] }
rosu-pp = "3.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"
mimalloc = "0.1"
pretty_assertions = "1.4.1"
rayon = "1.11.0"
rstest = "0.26.1"
serde_json = "1"

[[example]]
name = "minacalc527"

[[example]]
name = "quaver2025"

[[example]]
name = "osu2018"

[[example]]
name = "osu2016"

[[example]]
name = "sunnyxxy"

[[example]]
name = "daniel"

[[example]]
name = "leyna_recognition"

[[example]]
name = "interlude2025"

[[bench]]
name = "calculator_benchmark"
harness = false
